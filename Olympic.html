<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olympic Rings Logo</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:#ffeabf;
    }

    .olympic-logo {
      width: 360px;
      height: 200px;
      position: relative;
    }

    .ring {
      width: 90px;
      height: 90px;
      border: 8px solid;
      border-radius: 50%;
      position: absolute;
      box-sizing: border-box;
    }

    .blue {
      border-color: #0085c7;
      left: 45px;
      top: 20px;
    }

    .black {
      border-color: #000;
      left: 135px;
      top: 20px;
    }

    .red {
      border-color: #df0024;
      left: 225px;
      top: 20px;
    }

    .yellow {
      border-color: #f4c300;
      left: 90px;
      top: 75px;
    }

    .green {
      border-color: #009f3d;
      left: 180px;
      top: 75px;
    }
    .back{
    height: 50px;
    width: 100px;
    background: #0003ff;
    border-radius: 5px;
    color: white;
    margin-top: 50rem;
    display: flex;
    align-items: center; 
    justify-content: center;
    text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="olympic-logo">
    <div class="ring blue"></div>
    <div class="ring black"></div>
    <div class="ring red"></div>
    <div class="ring yellow"></div>
    <div class="ring green"></div>
  </div>
  
  <a class="back" href="index.html#projects">Back</a>

</body>
</html>
