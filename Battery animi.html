<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Battery Animination</title>
  <link rel="stylesheet" href="Index.css">
</head>
<style>
body{
  background: #c6c3c3;
  display: flex;
  justify-content: center;
  flex-direction: column;
  align-items: center;
}
.container{
  background: #888888;
  border: 5px solid white;
  height: 400px;
  width: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.top{
  border: 5px solid white;`
  height: 5px;
  width: 10px;
  margin-top: 25rem;
}
.ba1r{
  background: #26ff00;
  height: 80px;
  width: 190px;
  margin-top: 3px;
  animation: greenl 6s infinite;
}
.ba2r{
  background: #26ff00;
  height: 80px;
  width: 190px;
  margin-top: 3px;
  animation: greenli 6s infinite;
}
.ba3r{
  background: #26ff00;
  height: 80px;
  width: 190px;
  margin-top: 3px;
  animation: greenlig 6s infinite;
}
.ba4r{
  background: #26ff00;
  height: 80px;
  width: 190px;
  margin-top: 3px;
  animation: greenligh 6s infinite;
}
.ba5r{
  background: #26ff00;
  height: 80px;
  width: 190px;
  margin-top: 3px;
  animation: greenlight 6s infinite;
}
.back{
    height: 50px;
    width: 100px;
    background: #0003ff;
    border-radius: 5px;
    color: white;
    margin-top: 10rem;
    margin-left: 30rem;
    display: flex;
    align-items: center; 
    justify-content: center;
    text-decoration: none;
}
@keyframes greenlight{
  0%, 20%{
    opacity: 0;
  }
}
@keyframes greenligh{
  0%, 40%{
    opacity: 0;
  }
}
@keyframes greenlig{
  0%,60%{
    opacity: 0;
  }
}
@keyframes greenli{
  0%,80%{
    opacity: 0;
  }
}
@keyframes greenl{
  0%,90%{
    opacity: 0;
  }
}
</style>
<body>
    

  <div class="top"></div>
  
  <div class="container">
    <div class="ba1r"></div>
    <div class="ba2r"></div>
    <div class="ba3r"></div>
    <div class="ba4r"></div>
    <div class="ba5r"></div>
  </div>
  
   <a class="back" href="index.html#projects">Back</a>
   
   
</body>
</html>
